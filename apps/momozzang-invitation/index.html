<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>모모짱 청첩장</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/PyeongChang-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Wanted Sans 는 폰트 바이너리가 아니라 **서브셋 스타일시트**다.
         fonts.css 가 이 URL 을 @import 로 얹으므로 preload 도 as="style" 이어야 한다.
         as="font" 로 두면 preload 가 실제 요청과 매칭되지 않아 브라우저가
         "preloaded but not used" 경고를 낸다. -->
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
      as="style"
    />
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/gh/projectnoonnu/2409-1@1.0/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/PFStardust.woff"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
